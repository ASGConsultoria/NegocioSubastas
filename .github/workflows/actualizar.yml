name: Actualizar Subastas BOE

on:
  schedule:
    - cron: '0 7 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar scraper
        run: python scrape_boe.py

      - name: Hacer commit del JSON actualizado
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/subastas.json
          git diff --staged --quiet || git commit -m "Actualizar subastas BOE - $(date +'%Y-%m-%d')"
          git push
